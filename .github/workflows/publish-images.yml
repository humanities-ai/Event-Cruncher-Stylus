name: Publish images

# Builds the production ECS server and client images and publishes them to the
# private GitHub Container Registry. Watchtower on the VM polls the :latest
# tags and recreates the containers when a new image appears.
#
# Only builds from the default branch are tagged :latest, so a manual run from
# a feature branch (workflow_dispatch) can be used to test the build without
# deploying it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ecs-server
            context: ./server
            dockerfile: ./server/Dockerfile
          - name: ecs-client
            context: ./client
            dockerfile: ./client/Dockerfile.prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also stamps org.opencontainers.image.source with this repository's URL,
      # which links the package to the private repository and keeps it private.
      - name: Compute image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
